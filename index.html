<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --surface: #1a1a1c;
      --surface-2: #242426;
      --border: #2e2e31;
      --text: #f0ede8;
      --text-dim: #7a7a80;
      --accent: #e8c547;
      --accent-dim: #b89a2e;
      --danger: #e85555;
      --radius: 16px;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── Wrapper holds calc + history side by side ── */
    .wrapper {
      display: flex;
      align-items: stretch;
      gap: 0;
      animation: rise .5s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    .calculator {
      width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.04) inset,
        0 32px 80px rgba(0,0,0,.6),
        0 0 60px rgba(232,197,71,.04);
      position: relative;
      z-index: 2;
      transition: border-radius .3s ease;
    }

    .history-open .calculator {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }

    /* ── History Panel ── */
    .history-panel {
      width: 0;
      overflow: hidden;
      background: #131314;
      border: 1px solid var(--border);
      border-left: none;
      border-top-right-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
      display: flex;
      flex-direction: column;
      transition: width .35s cubic-bezier(.16,1,.3,1);
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
    }

    .history-open .history-panel {
      width: 220px;
    }

    .history-header {
      padding: 16px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-width: 220px;
    }

    .history-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .clear-history-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: var(--danger);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      height: auto;
      transition: background .15s;
      letter-spacing: .02em;
    }
    .clear-history-btn:hover { background: rgba(232,85,85,.12); }
    .clear-history-btn:active { transform: none; }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      min-width: 220px;
    }

    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .history-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(46,46,49,.5);
      transition: background .12s;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item:hover { background: rgba(255,255,255,.03); }

    .history-item .h-expr {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .history-item .h-result {
      font-family: 'Space Mono', monospace;
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item .h-tap {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 3px;
      opacity: 0;
      transition: opacity .15s;
      font-family: 'DM Sans', sans-serif;
    }
    .history-item:hover .h-tap { opacity: 1; }

    .history-empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.6;
      min-width: 220px;
    }

    .history-empty svg {
      display: block;
      margin: 0 auto 12px;
      opacity: .3;
    }

    /* ── Display ── */
    .display {
      padding: 16px 24px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
      position: relative;
    }

    /* History toggle button inside display */
    .history-toggle {
      position: absolute;
      top: 12px;
      left: 14px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 32px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, border-color .15s;
      padding: 0;
    }
    .history-toggle:hover { background: var(--surface-2); border-color: #444; }
    .history-toggle:active { transform: scale(.9); }
    .history-toggle svg { display: block; }

    .expression {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
      text-align: right;
      min-height: 18px;
      letter-spacing: .03em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result {
      font-family: 'Space Mono', monospace;
      font-size: 40px;
      font-weight: 700;
      color: var(--text);
      text-align: right;
      letter-spacing: -.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: font-size .15s ease;
    }

    .result.long { font-size: 28px; }
    .result.very-long { font-size: 20px; }

    /* ── Buttons ── */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
    }

    button {
      padding: 0;
      height: 68px;
      background: var(--surface-2);
      border: none;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      cursor: pointer;
      transition: background .12s, color .12s, transform .08s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.93); }

    button.fn {
      background: #1e1e20;
      color: var(--text-dim);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
    }
    button.fn:hover { background: #262628; color: var(--text); }

    button.op {
      background: #1f1e18;
      color: var(--accent);
    }
    button.op:hover { background: #28261a; }

    button.eq {
      background: var(--accent);
      color: #1a1500;
      font-weight: 700;
    }
    button.eq:hover { background: #f0cf57; }

    button.zero { grid-column: span 2; }
    button.clear { color: var(--danger); }

    button:not(.eq):not(.fn):not(.op):hover { background: #2c2c30; }

    /* ── Footer ── */
    .footer {
      padding: 10px 16px;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: .06em;
      text-transform: uppercase;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="wrapper" id="wrapper">

  <div class="calculator" role="application" aria-label="Calculator">
    <div class="display">

      <!-- History toggle button -->
      <button class="history-toggle" onclick="toggleHistory()" aria-label="Toggle history" title="Calculation history">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="6.5" stroke="#7a7a80" stroke-width="1.2"/>
          <polyline points="8,4.5 8,8.5 10.5,10.5" stroke="#7a7a80" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="expression" id="expression" aria-live="polite"></div>
      <div class="result" id="result" aria-live="polite">0</div>
    </div>

    <div class="buttons">
      <button class="fn clear" onclick="clearAll()" aria-label="Clear all">AC</button>
      <button class="fn" onclick="toggleSign()" aria-label="Toggle sign">+/−</button>
      <button class="fn" onclick="percentage()" aria-label="Percentage">%</button>
      <button class="op" onclick="setOp('/')" aria-label="Divide">÷</button>

      <button onclick="input('7')">7</button>
      <button onclick="input('8')">8</button>
      <button onclick="input('9')">9</button>
      <button class="op" onclick="setOp('*')" aria-label="Multiply">×</button>

      <button onclick="input('4')">4</button>
      <button onclick="input('5')">5</button>
      <button onclick="input('6')">6</button>
      <button class="op" onclick="setOp('-')" aria-label="Subtract">−</button>

      <button onclick="input('1')">1</button>
      <button onclick="input('2')">2</button>
      <button onclick="input('3')">3</button>
      <button class="op" onclick="setOp('+')" aria-label="Add">+</button>

      <button class="zero" onclick="input('0')">0</button>
      <button onclick="inputDot()">.</button>
      <button class="eq" onclick="calculate()" aria-label="Equals">=</button>
    </div>

    <div class="footer">Calculator</div>
  </div>

  <!-- History Panel -->
  <div class="history-panel" id="historyPanel" aria-label="Calculation history">
    <div class="history-header">
      <span class="history-title">History</span>
      <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty" id="historyEmpty">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="12" stroke="#7a7a80" stroke-width="1.4"/>
          <polyline points="14,7 14,14.5 18,17.5" stroke="#7a7a80" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        No calculations yet.<br/>Results will appear here.
      </div>
    </div>
  </div>

</div>

<script>
  let current = '0';
  let previous = '';
  let operator = null;
  let justCalculated = false;
  let historyVisible = false;
  let history = [];

  const resultEl     = document.getElementById('result');
  const expressionEl = document.getElementById('expression');
  const wrapper      = document.getElementById('wrapper');
  const historyList  = document.getElementById('historyList');
  const historyEmpty = document.getElementById('historyEmpty');

  /* ── Display ── */
  function updateDisplay() {
    resultEl.textContent = current;
    resultEl.classList.toggle('long', current.length > 9);
    resultEl.classList.toggle('very-long', current.length > 13);
  }

  /* ── Input ── */
  function input(digit) {
    if (justCalculated) { current = digit; justCalculated = false; }
    else if (current === '0') current = digit;
    else if (current.length < 15) current += digit;
    updateDisplay();
  }

  function inputDot() {
    if (justCalculated) { current = '0.'; justCalculated = false; updateDisplay(); return; }
    if (!current.includes('.')) current += '.';
    updateDisplay();
  }

  function setOp(op) {
    if (operator && !justCalculated) calculate(true);
    previous = current;
    operator = op;
    justCalculated = false;
    current = '0';
    const sym = { '+': '+', '-': '−', '*': '×', '/': '÷' };
    expressionEl.textContent = `${previous} ${sym[op]}`;
  }

  function calculate(chaining = false) {
    if (!operator || previous === '') return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let res;
    switch (operator) {
      case '+': res = a + b; break;
      case '-': res = a - b; break;
      case '*': res = a * b; break;
      case '/': res = b === 0 ? 'Error' : a / b; break;
    }
    const sym = { '+': '+', '-': '−', '*': '×', '/': '÷' };
    const exprText = `${previous} ${sym[operator]} ${current}`;
    if (!chaining) expressionEl.textContent = exprText + ' =';
    const resultVal = res === 'Error' ? 'Error' : String(parseFloat(res.toFixed(10)));

    if (!chaining) {
      // Save to history
      addToHistory(exprText, resultVal);
      operator = null;
      previous = '';
      justCalculated = true;
    }

    current = resultVal;
    updateDisplay();
  }

  function clearAll() {
    current = '0'; previous = ''; operator = null; justCalculated = false;
    expressionEl.textContent = '';
    updateDisplay();
  }

  function toggleSign() {
    if (current !== '0' && current !== 'Error') {
      current = current.startsWith('-') ? current.slice(1) : '-' + current;
      updateDisplay();
    }
  }

  function percentage() {
    if (current !== 'Error') {
      current = String(parseFloat(current) / 100);
      updateDisplay();
    }
  }

  /* ── History ── */
  function toggleHistory() {
    historyVisible = !historyVisible;
    wrapper.classList.toggle('history-open', historyVisible);
  }

  function addToHistory(expr, result) {
    if (result === 'Error') return;
    history.unshift({ expr, result }); // newest first
    if (history.length > 50) history.pop();
    renderHistory();
  }

  function renderHistory() {
    // Remove old items (keep header empty div)
    historyList.querySelectorAll('.history-item').forEach(el => el.remove());

    if (history.length === 0) {
      historyEmpty.style.display = '';
      return;
    }
    historyEmpty.style.display = 'none';

    history.forEach(({ expr, result }, i) => {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.setAttribute('title', 'Tap to use this result');
      item.innerHTML = `
        <div class="h-expr">${expr} =</div>
        <div class="h-result">${result}</div>
        <div class="h-tap">Tap to use</div>
      `;
      item.addEventListener('click', () => {
        current = result;
        justCalculated = true;
        operator = null;
        previous = '';
        expressionEl.textContent = '';
        updateDisplay();
      });
      historyList.appendChild(item);
    });
  }

  function clearHistory() {
    history = [];
    renderHistory();
  }

  /* ── Keyboard ── */
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') input(e.key);
    else if (e.key === '.') inputDot();
    else if (e.key === '+') setOp('+');
    else if (e.key === '-') setOp('-');
    else if (e.key === '*') setOp('*');
    else if (e.key === '/') { e.preventDefault(); setOp('/'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'h' || e.key === 'H') toggleHistory();
    else if (e.key === 'Backspace') {
      if (current.length > 1) current = current.slice(0, -1);
      else current = '0';
      updateDisplay();
    }
  });
</script>
</body>
</html>
